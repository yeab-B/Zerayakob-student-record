<style type="text/css">
  h2,

    margin-top: 5px;

    color: #27447a;
  }

  #tableHeader {
    max-height: 52px;
  }

  #tableBody {
    visibility: hidden;
  }

  .triangle-down {
    margin-top: 6px;
    margin-bottom: 2px;
    margin-right: 0px;
    margin-left: -21px;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;

    float: left;
  }

    margin-top: 4px;

    margin-left: -18px;
    border-top: 6px solid transparent;
    border-left: 6px solid #969EAF;
    border-bottom: 6px solid transparent;

  .scrolltable {
    overflow-x: scroll;
    height: 100%;
    display: flex;
    display: -webkit-flex;
    flex-direction: column;
    -webkit-flex-direction: column;
  }

  .scrolltable>.header {}

    overflow-y: scroll;
    flex: 1;
    -webkit-flex: 1;
  }

  #constrainer {
    width: 100vw;

  html {

  }

  body {

  }

  thead,
  tbody,

  }

  td,

    padding: 13px;
    overflow: hidden;

    border: 1px solid;
  }

  td {
    word-break: break-word;
    white-space: wrap;
    overflow-wrap: wrap;
    border-color: #969EAF20 #969EAF85 #969EAF20 #969EAF85;
  }

  th {
    text-overflow: ellipsis;
    white-space: nowrap;
    position: -webkit-sticky;
    position: sticky;
    top: 0;
    background: white;
    text-align: center;
    font-weight: bold;
    color: #27447a;
    padding: 16px;
    position: relative;
    border-color: #969EAF85;
  }

  td:first-child,
  th:first-child,
  td:nth-child(1),
  th:nth-child(1) {
    border-left-color: #969EAF85;
  }

  td:first-child,
  th:first-child,
  td:last-child,
  th:last-child {
    border-right-color:#969EAF85;
  }

  .rowDD {
    border-top: 1px solid #969EAF;
    border-bottom: 1px solid #969EAF85;
  }

  .rowDL {
    border-top: 1px solid #969EAF;
    border-bottom: 1px solid #969EAF20;
  }

  .rowLD {
    border-top: 1px solid #969EAF20;
    border-bottom: 1px solid #969EAF20;
  }

  .student {
    text-align: center;
  }

  .score {
    font-size: 0.75rem;
  }

  .resize-handle {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    background: #ccced6;
    opacity: 0;
    width: 3px;
    cursor: col-resize;
  }

  .resize-handle:hover,
  .header--being-resized .resize-handle {
    opacity: 1.0;
  }

  th:hover .resize-handle {
    opacity: 0.75;
  }

  td {
    padding-top: 10px;
    padding-bottom: 10px;
    color: #8991A0;
  }

  .bold {
    font-weight: bold;
  }

  .lightGray {
    color: #DFE1E7
  }

  .darkGray {
    color: #969EAF
  }

    color: #e17f60

    color: #82c77d

    color: #f6c24f

  .blue {

  .clickable {

  .level1 {

  .level2 {

      minmax(300px, 3.33fr) minmax(100px, 1fr) minmax(100px, 1fr) minmax(100px, 1fr) minmax(100px, 1fr) minmax(100px, 1fr)
    }
</style>

    // column risizing code.  borrowed from https://codepen.io/adam-lynch/pen/XwKWdG
    const minColWidth = 80;

    const tableHeader = document.getElementById("tableHeader");
    const tableBody = document.getElementById("tableBody");
    const tableRows = tableBody.children[0];

    const columns = [];
    let headerBeingResized;

    const onMouseMove = e => requestAnimationFrame(() => {
      horizontalScrollOffset = document.documentElement.scrollLeft;
      const width = horizontalScrollOffset + e.clientX - headerBeingResized.offsetLeft;

      const column = columns.find(({ header }) => header === headerBeingResized);
      column.size = Math.max(minColWidth, width) + 'px';

      columns.forEach(column => {
        if (column.size.startsWith('minmax')) {
          column.size = parseInt(column.header.clientWidth, 10) + 'px';
        }
      });

      tableHeader.style.gridTemplateColumns = columns.
        map(({ header, size }) => size).
        join(' ');
      tableBody.style.gridTemplateColumns = columns.
        map(({ header, size }) => size).
        join(' ');
    });

    const onMouseUp = () => {
      window.removeEventListener('mousemove', onMouseMove);
      window.removeEventListener('mouseup', onMouseUp);
      headerBeingResized.classList.remove('header--being-resized');
      headerBeingResized = null;
    };

    const initResize = ({ target }) => {
      headerBeingResized = target.parentNode;
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);
      headerBeingResized.classList.add('header--being-resized');
    };

    document.querySelectorAll('th').forEach(header => {
      const max = '1fr';
      columns.push({
        header,
        size: `minmax(${minColWidth}px, ${max})`
      });

      header.querySelector('.resize-handle').addEventListener('mousedown', initResize);
    });

    // end of column resizing code.

    function onload() {
      checkColumnWidths();

      loadData();

      createHorizLines123();

      createHorizLines45(false);

      collapseLists();

      createHorizLines45(true);

      // make table visible
      tableBody.style.visibility = "visible";
    }

    function addCSSToCols(row, css) {
      for (j = 0; j < row.children.length; j++) {
        col = row.children[j];
        colClass = col.className;
        col.className = (col.className.length == 0) ? css : col.className + " " + css;
      }
    }

    function removeCSSFromCols(row, css) {
      for (j = 0; j < row.children.length; j++) {
        col = row.children[j];
        colClass = col.className;
        ipos = col.className.indexOf(css)
        if (ipos == 0)
          col.className = "";
        else if (ipos > 0)
          col.className = col.className.substr(0, ipos - 1);
      }
    }

    function createHorizLines123() {
      numRows = tableRows.children.length;

      // create horiz lines
      for (i = 0; i < numRows; i++) {
        row = tableRows.children[i];
        rowClass = getBaseClassName(row.children[0]);
        if (rowClass == "level1" || rowClass == "level2")
          addCSSToCols(row, "rowDD");
        else if (rowClass == "level3")
          addCSSToCols(row, "rowDL");
      }
    }

    function createHorizLines45(level4) {
      numRows = tableRows.children.length;

      // create horiz lines
      for (i = 0; i < numRows; i++) {
        row = tableRows.children[i];
        rowClass = getBaseClassName(row.children[0]);
        if (rowClass != "level3")
          continue;
        prevRow = tableRows.children[i - 1];
        prevClass = getBaseClassName(prevRow.children[0]);
        if ((level4 && prevClass == "level4") ||
          (!level4 && (prevClass == "level5" || prevClass == "level6"))) {
          addCSSToCols(prevRow, "rowLD")
        }
      }
    }

    function collapseLists() {
      numRows = tableRows.children.length;

      // collapse the lists, add the triangles
      for (i = numRows - 1; i >= 0; i--) {
        row = tableRows.children[i];
        col0 = row.children[0]
        rowClass = getBaseClassName(col0);

        if (rowClass == "level2")
          addTriangle(col0, true)
        if (rowClass == "level4") {
          onToggleRow(col0, true)
          addTriangle(col0, false)
        }
      }
    }

    function getBaseClassName(elem) {
      if (elem.className.length == 0)
        return "";
      ipos = elem.className.indexOf(" ");
      return (ipos < 0 ? elem.className : elem.className.substring(0, ipos));
    }

    function addTriangle(col, expanded) {
      newDiv = document.createElement("div");
      newDiv.className = expanded ? "triangle-down" : "triangle-right";
      col.appendChild(newDiv);

      col.addEventListener('click', (event) => ((arg) => onToggleRow(arg))(col));
    }

    const s_mapRows = {};

    function onToggleRow(elem, isInit) {
      row = elem.parentNode;
      rowId = row.id;
      rowClass = getBaseClassName(elem);
      isList = (rowClass == "level4");

      if (elem.children.length > 0)
        elem.children[0].className = (s_mapRows[rowId] != null) ? "triangle-down" : "triangle-right";

      if (s_mapRows[rowId] != null) {
        // expand
        removeCSSFromCols(row, "rowLD");
        arr = s_mapRows[rowId];
        lastRow = row;
        for (iRow = 0; iRow < arr.length; iRow++) {
          r = arr[iRow]
          lastRow.parentNode.insertBefore(r, lastRow.nextSibling);
          lastRow = r;
        }
        s_mapRows[rowId] = null;
      }
      else {
        // collapse
        arr = new Array;
        while (true) {
          nextRow = row.nextElementSibling;
          nextRowClass = nextRow ? getBaseClassName(nextRow.children[0]) : ""
          if (nextRow && ((isList && nextRowClass == "level5") || (!isList && nextRowClass != "level2" && nextRowClass != "level1"))) {
            nextRow.parentNode.removeChild(nextRow);
            arr.push(nextRow);
          }
          else {
            if (arr.length > 0)
              s_mapRows[rowId] = arr;
            break;
          }
        }
        if (isList) {
          nextRow = row.nextElementSibling;
          if (nextRow && nextRow.children.length > 0) {
            nextRowClass = getBaseClassName(nextRow.children[0]);
            if (nextRowClass == "level4" || nextRowClass == "level5" || nextRowClass == "level6")
              return;
          }
          if (!isInit) {
            addCSSToCols(row, "rowLD");
          }
        }
      }
    }

    function loadData() {
      for (iData = 0; iData < dataRows.length; iData++) {
        parts = dataRows[iData].split("\t");
        level = parts[0];
        title = parts[1];
        strScores = parts[2];
        allEmpty = (strScores.length == 0);
        scores = allEmpty ? "" : strScores.split(",");
        tr = document.createElement("tr");
        tr.id = "row" + iData;

        td = document.createElement("td");
        td.className = "level" + level;
        td.innerHTML = title;
        tr.appendChild(td);

        for (i = 0; i < numStudents; i++) {
          td = document.createElement("td");
          if (!allEmpty && scores[i].length > 0) {
            score = scores[i];
            text = score;
            css = "student"
            if (score.indexOf("/") >= 0)
              css += (score.substr(0, 1) === "0") ? " lightGray bold" : " darkGray bold";
            else if (score === "V") {
              css += " green score";
              text = "Viewed"
            }
            else {
              iScore = parseInt(score, 10);
              if (iScore >= 80)
                css += " green";
              else if (iScore >= 50)
                css += " yellow";
              else
                css += " orange";
              css += (level == "4") ? " bold" : " score";
              text = score + "%";
            }
            td.innerHTML = text;
            td.className = css;
          }

          tr.appendChild(td);
        }
        tableRows.appendChild(tr);
      }
    }

    function checkColumnWidths() {
      const w1Cols = 350;
      const wCol = 100;
      if (tableHeader.offsetWidth > w1Cols + (wCol * (numStudents + 1))) {
        for (i = 0; i < columns.length; i++) {
          col = columns[i];
          if (col.size.startsWith('minmax')) {
            col.size = (i == 0) ? '350px' : '100px';
          }
        }
        tableHeader.style.gridTemplateColumns = columns.
          map(({ header, size }) => size).
          join(' ');
        tableBody.style.gridTemplateColumns = columns.
          map(({ header, size }) => size).
          join(' ');
      }
    }
